# Gbox Platform — Common TLS settings for per-domain server blocks
# (Landing Page System Phase 1D)
#
# Install at /etc/nginx/snippets/gbox-ssl-common.conf. Referenced from
# every server block written by nginx-writer.ts via:
#
#     include /etc/nginx/snippets/gbox-ssl-common.conf;
#
# Mirrors Mozilla "intermediate" profile 2024 — compatible with every
# modern browser while retaining TLS 1.2 for legacy Android / IE11.
# If you want to drop TLS 1.2, edit `ssl_protocols` here and reload
# once; every merchant domain inherits the change automatically.

# --- Protocols + ciphers -----------------------------------------------------
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
ssl_prefer_server_ciphers off;

# --- Session cache -----------------------------------------------------------
ssl_session_cache shared:GboxSSL:50m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# --- OCSP stapling -----------------------------------------------------------
# Let's Encrypt issues certs with an OCSP responder URL. Stapling
# the response saves the client a round-trip.
ssl_stapling on;
ssl_stapling_verify on;
resolver 1.1.1.1 1.0.0.1 8.8.8.8 valid=300s;
resolver_timeout 5s;

# --- Security headers --------------------------------------------------------
# HSTS for 1 year; includeSubDomains is safe because per-merchant
# domains never have untrusted subdomains. We deliberately do NOT
# emit `preload` — merchant domains shouldn't be registered in the
# HSTS preload list on Gbox's behalf.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# --- Upload limits -----------------------------------------------------------
# Storefront uploads (e.g. product image previews from a merchant
# dashboard proxied through the edge) cap at 20 MB. Tune upward if
# the theme editor starts rejecting large assets.
client_max_body_size 20m;
