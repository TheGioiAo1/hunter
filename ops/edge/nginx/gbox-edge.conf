# Gbox Platform — Edge Nginx Root Include
# (Landing Page System Phase 1D)
#
# Install this file at /etc/nginx/conf.d/gbox-edge.conf on the edge
# host. It pulls in the snippets + the per-domain server blocks that
# the SSL orchestrator writes into /etc/nginx/gbox-domains/.
#
# Assumptions:
#   - nginx >= 1.18 (for SNI + http2).
#   - The `snippets/` directory from this repo has been deployed to
#     /etc/nginx/snippets/ (the default Debian/Ubuntu location).
#   - `/var/www/acme-webroot` exists and is world-readable so lego
#     can write ACME HTTP-01 challenge files there.
#   - `/etc/nginx/gbox-domains/` exists (orchestrator creates it on
#     first write if missing) and is writable by the `gbox-edge`
#     system user.
#   - The default_server for catch-all 80/443 is defined elsewhere
#     (usually /etc/nginx/sites-enabled/default). We intentionally
#     do NOT own the default_server here so `nginx -t` stays quiet
#     even before any merchant domain is connected.

# Pull every per-domain server block. Orchestrator writes atomically
# (tmp+rename) so a reload mid-write never sees a partial config.
include /etc/nginx/gbox-domains/*.conf;
