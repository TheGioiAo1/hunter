# TEMPLATE — KHÔNG apply trực tiếp file này.
# Dùng `bootstrap.sh` để fetch password từ Machine 1 và tạo Secret an toàn,
# tránh commit credential vào git.
#
# File này chỉ tham khảo cấu trúc.

apiVersion: v1
kind: Secret
metadata:
  name: gbox-db-credentials
  namespace: gbox-fe
type: Opaque
stringData:
  # Mongo URI cho từng database (BE đã tạo 13 DB sẵn user `gbox`)
  MONGO_USERS:      "mongodb://gbox:<PASS>@mongodb:27017/Gbox-Users?authSource=Gbox-Users"
  MONGO_SHOPS:      "mongodb://gbox:<PASS>@mongodb:27017/Gbox-Shops?authSource=Gbox-Shops"
  MONGO_PRODUCTS:   "mongodb://gbox:<PASS>@mongodb:27017/Gbox-Products?authSource=Gbox-Products"
  MONGO_ORDERS:     "mongodb://gbox:<PASS>@mongodb:27017/Gbox-Orders?authSource=Gbox-Orders"
  MONGO_CUSTOMERS:  "mongodb://gbox:<PASS>@mongodb:27017/Gbox-Customers?authSource=Gbox-Customers"
  MONGO_EMAILS:     "mongodb://gbox:<PASS>@mongodb:27017/Gbox-Emails?authSource=Gbox-Emails"
  MONGO_PAGES:      "mongodb://gbox:<PASS>@mongodb:27017/Gbox-Pages?authSource=Gbox-Pages"
  MONGO_PAYMENTS:   "mongodb://gbox:<PASS>@mongodb:27017/Gbox-Payments?authSource=Gbox-Payments"
  MONGO_SHIPPINGS:  "mongodb://gbox:<PASS>@mongodb:27017/Gbox-Shippings?authSource=Gbox-Shippings"
  MONGO_LAYOUTS:    "mongodb://gbox:<PASS>@mongodb:27017/Gbox-Layouts?authSource=Gbox-Layouts"
  MONGO_APPS:       "mongodb://gbox:<PASS>@mongodb:27017/Gbox-Apps?authSource=Gbox-Apps"
  MONGO_WEBHOOKS:   "mongodb://gbox:<PASS>@mongodb:27017/Gbox-Webhooks?authSource=Gbox-Webhooks"
  MONGO_LOCATIONS:  "mongodb://gbox:<PASS>@mongodb:27017/Gbox-Locations?authSource=Gbox-Locations"
  REDIS_URL:        "redis://default:<PASS>@redis:6379/0"
