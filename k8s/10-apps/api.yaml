apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: gbox-fe
  labels: { app: api }
spec:
  replicas: 1
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      containers:
        - name: api
          image: ghcr.io/thegioiao1/hunter:dev
          imagePullPolicy: IfNotPresent
          command: ["sh","-c","node --import tsx start.mjs"]
          ports: [{ containerPort: 4321 }]
          env:
            - { name: PORT, value: "4321" }
          envFrom:
            - configMapRef: { name: apps-config }
            - secretRef:    { name: apps-secrets }
            - secretRef:    { name: gbox-db-credentials }
          readinessProbe:
            tcpSocket: { port: 4321 }
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 6
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata: { name: api, namespace: gbox-fe }
spec:
  selector: { app: api }
  ports: [{ port: 4321, targetPort: 4321 }]
