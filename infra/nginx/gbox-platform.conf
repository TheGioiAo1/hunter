# =============================================================================
# Gbox Platform — Nginx Reverse Proxy
# admin.gbox.co qua Cloudflare proxy (Flexible SSL — VPS chỉ serve HTTP)
# Path routing: /accounts → accounts:4323, / → store-admin:4325
# =============================================================================

server {
    listen 80;
    server_name admin.gbox.co;
    client_max_body_size 50M;

    # SSE / event-stream endpoints — buffering OFF nếu không sẽ bị
    # "upstream prematurely closed connection" và hiện 502 lên client.
    # Match path kết thúc bằng /stream, /sse, /events (notifications/stream,
    # analytics/live/stream, ...).
    location ~ /(stream|sse|events)$ {
        proxy_pass http://127.0.0.1:4325;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        chunked_transfer_encoding off;
    }

    # Accounts app: login, signup, 2FA, password reset, OAuth
    location /accounts/ {
        proxy_pass http://127.0.0.1:4323;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    # Default: store-admin (seller dashboard)
    location / {
        proxy_pass http://127.0.0.1:4325;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }
}
