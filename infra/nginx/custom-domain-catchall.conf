# ═══════════════════════════════════════════════════════════════════
# CATCH-ALL — forward unknown Host headers to storefront
# ═══════════════════════════════════════════════════════════════════
#
# Sellers who point a custom domain at the platform origin IP
# (dev: 14.224.236.129) land here. The storefront's resolve-shop
# middleware looks up `shop_domains.domain = $host AND verified =
# true`; unverified / unknown hosts get a 404 from the app layer.
#
# We do NOT include the Cloudflare real-IP snippet here because
# direct-A traffic doesn't traverse Cloudflare — the client IP is
# already in $remote_addr. Requests that DO come via Cloudflare
# match one of the explicit server_name blocks above.
#
# Bare-IP requests (bots hitting 14.224.236.129 directly) still
# get 444'd so we never serve storefront HTML over an unresolved
# tenant.
#
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Drop scans that hit the server by IP (no Host or IP-literal
    # Host). The check rejects plain IPv4 and bracketed IPv6.
    if ($host ~* "^[0-9.]+$") {
        return 444;
    }
    if ($host ~* "^\[.*\]$") {
        return 444;
    }

    # ───────────────────────────────────────────────────────────
    # ACME HTTP-01 challenge — Let's Encrypt validation.
    # Phase 1 of the custom-domain origin TLS roadmap. lego writes
    # challenge files to /var/www/acme-webroot/.well-known/acme-
    # challenge/<token>; nginx serves them from disk so the ACME
    # validator's GET hits a real file and the storefront app
    # never sees the request. This MUST come before the proxy_pass
    # location, otherwise the catch-all swallows the request and
    # the storefront 404s the validator.
    #
    # Setup (one-time, on each origin server):
    #   sudo mkdir -p /var/www/acme-webroot/.well-known/acme-challenge
    #   sudo chown -R botesty:botesty /var/www/acme-webroot
    # ───────────────────────────────────────────────────────────
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme-webroot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:4326;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
