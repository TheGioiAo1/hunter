name: Preview Deploy

on:
  push:
    branches-ignore:
      - main

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  preview:
    name: Build & Deploy Preview
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        # --legacy-peer-deps: @anthropic-ai/claude-agent-sdk peers on
        # zod@^4 but root project pins zod@^3.25 (kysely, astro, etc).
        # Same flag used locally to regenerate package-lock.json.
        run: npm ci --legacy-peer-deps

      - name: TypeScript check
        run: npm run typecheck

      - name: Run tests
        run: npm test -- --run --reporter=verbose
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

      - name: Build storefront
        run: npm run build --workspace=packages/storefront
        env:
          CF_PAGES: "true"
          NODE_ENV: production

      - name: Check for Cloudflare deploy secrets
        id: cf_secrets
        # Surface secret presence via a step output so the deploy step
        # can gate on it. Referencing `secrets.*` directly in an
        # `if:` condition is not allowed by GitHub Actions.
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_API_TOKEN" ] && [ -n "$CF_ACCOUNT_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages
        # Only deploy when Cloudflare credentials are available. Skipping
        # keeps the job green for PRs from forks / contributors who don't
        # have access to the deploy secrets. Main-branch / trusted pushes
        # that have the token set still deploy normally.
        if: steps.cf_secrets.outputs.available == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy packages/storefront/dist --project-name=gbox-platform --branch=${{ github.ref_name }}
        id: deploy

      - name: Comment preview URL
        if: github.event_name == 'push' && steps.cf_secrets.outputs.available == 'true' && steps.deploy.outputs.deployment-url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const deployUrl = '${{ steps.deploy.outputs.deployment-url }}';
            if (!deployUrl) return;

            // Find associated PR for this branch
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${context.ref.replace('refs/heads/', '')}`,
              state: 'open',
            });

            for (const pr of prs) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: `**Preview deployed:** ${deployUrl}\n\nCommit: ${context.sha.substring(0, 7)}`,
              });
            }
